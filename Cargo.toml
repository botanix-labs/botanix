reth-db = { git = "https://github.com/botanix-labs/reth", branch="botanix" }
reth-db-common = { git = "https://github.com/botanix-labs/reth",  branch="botanix" }
reth-db-models = { git = "https://github.com/botanix-labs/reth",  branch="botanix" }
reth-db-api = { git = "https://github.com/botanix-labs/reth",  branch="botanix" }
reth-engine-local = { git = "https://github.com/botanix-labs/reth", branch="botanix" }
reth-chainspec = { git = "https://github.com/botanix-labs/reth", branch="botanix" }
reth-consensus = { git = "https://github.com/botanix-labs/reth",  branch="botanix" }
reth-cli-util = { git = "https://github.com/botanix-labs/reth", branch="botanix" }
