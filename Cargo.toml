reth-engine-tree = { git = "https://github.com/botanix-labs/reth",  branch="botanix" }
reth-ethereum = { git = "https://github.com/botanix-labs/reth",  branch="botanix", features = ["test-utils", "node", "provider", "pool", "network", "rpc"] }
reth-ethereum-payload-builder = { git = "https://github.com/botanix-labs/reth", branch="botanix" }
reth-ethereum-consensus = { git = "https://github.com/botanix-labs/reth", branch="botanix" }
reth-ethereum-primitives = { git = "https://github.com/botanix-labs/reth", branch="botanix" }
reth-eth-wire = { git = "https://github.com/botanix-labs/reth", branch="botanix" }
reth-eth-wire-types = { git = "https://github.com/botanix-labs/reth", branch="botanix" }
reth-evm = { git = "https://github.com/botanix-labs/reth", branch="botanix" }
reth-evm-ethereum = { git = "https://github.com/botanix-labs/reth", branch="botanix" }
reth-execution-errors = { git = "https://github.com/botanix-labs/reth",  branch="botanix" }
reth-node-core = { git = "https://github.com/botanix-labs/reth", branch="botanix" }
reth-node-builder = { git = "https://github.com/botanix-labs/reth",  branch="botanix" }
reth-revm = { git = "https://github.com/botanix-labs/reth", branch="botanix" }
reth-network = { git = "https://github.com/botanix-labs/reth", branch="botanix", features = ["test-utils"] }
reth-network-p2p = { git = "https://github.com/botanix-labs/reth", branch="botanix" }
reth-network-api = { git = "https://github.com/botanix-labs/reth", branch="botanix" }
reth-node-ethereum = { git = "https://github.com/botanix-labs/reth", branch="botanix", features = ["test-utils"] }
reth-node-types =  { git = "https://github.com/botanix-labs/reth", branch="botanix" }
reth-network-peers = { git = "https://github.com/botanix-labs/reth", branch="botanix" }
reth-payload-primitives = { git = "https://github.com/botanix-labs/reth", branch="botanix" }
reth-primitives = { git = "https://github.com/botanix-labs/reth", branch="botanix", features = ["secp256k1"] }
reth-primitives-traits = { git = "https://github.com/botanix-labs/reth", branch="botanix" }
reth-provider = { git = "https://github.com/botanix-labs/reth", branch="botanix", features = ["test-utils"] }
reth-prune = { git = "https://github.com/botanix-labs/reth", branch="botanix" }
reth-prune-types = { git = "https://github.com/botanix-labs/reth", branch="botanix", features = ["test-utils"] }
reth-payload-builder = { git = "https://github.com/botanix-labs/reth",  branch="botanix" }
reth-rpc-eth-api = { git = "https://github.com/botanix-labs/reth", branch="botanix" }
reth-rpc-engine-api = { git = "https://github.com/botanix-labs/reth", branch="botanix" }
reth-rpc-server-types = { git = "https://github.com/botanix-labs/reth", branch="botanix" }
reth-tasks = { git = "https://github.com/botanix-labs/reth",  branch="botanix" }
reth-transaction-pool = { git = "https://github.com/botanix-labs/reth",  branch="botanix" }
reth-tracing = { git = "https://github.com/botanix-labs/reth", branch="botanix" }
reth-trie-common = { git = "https://github.com/botanix-labs/reth", branch="botanix" }
reth-trie-db = { git = "https://github.com/botanix-labs/reth", branch="botanix" }
reth-trie = { git = "https://github.com/botanix-labs/reth",  branch="botanix" }
reth-storage-api = { git = "https://github.com/botanix-labs/reth",  branch="botanix" }
reth-storage-errors = { git = "https://github.com/botanix-labs/reth",  branch="botanix" }
reth-metrics = { git = "https://github.com/botanix-labs/reth", branch="botanix" }

# revm - exact version to match fork
revm = "=28.0.1"
revm-primitives = { version = "20.2.1", features = ["std"] }
revm-database = { version = "7.0.5", default-features = false }

# Tendermint
# tendermint = { version = "0.40.1", features = ["clock"] }
tendermint-abci = "0.40.1"
tendermint-rpc = { version = "0.40.1", features = ["http-client"] }
tendermint-proto = "0.40.1"
tendermint-light-client = { version = "0.40.1", features = ["secp256k1", "rpc-client"] }
tendermint = { git = "https://github.com/bnb-chain/tendermint-rs-parlia", rev = "8c21ccbd58a174e07eed2c9343e63ccd00f0fbd5", features = ["secp256k1"] }

# alloy dependencies - match working standalone version
alloy-evm = "=0.18.2"
alloy-genesis = "=1.0.23"
alloy-consensus = "=1.0.23"
alloy-eips = "=1.0.23"
alloy-network = "=1.0.23"
alloy-rpc-types = { version = "=1.0.23", features = ["engine"] }
alloy-rpc-types-eth = "=1.0.23"
alloy-rpc-types-engine = "=1.0.23"
alloy-serde = "=1.0.23"
alloy-signer = "=1.0.23"
alloy-chains = "=0.2.5"
alloy-hardforks = "0.2.7"
alloy-rlp = { version = "=0.3.10", default-features = false, features = ["core-net"] }
alloy-dyn-abi = "=1.3.0"
alloy-json-abi = { version = "=1.3.0", default-features = false }
alloy-primitives = { version = "=1.3.0", default-features = false, features = ["map", "map-foldhash", "std", "getrandom"] }
alloy-sol-macro = "=1.3.0"
alloy-sol-types = { version = "=1.3.0", default-features = false }

# json rpc
jsonrpsee = "=0.25.1"
jsonrpsee-core = "=0.25.1"
jsonrpsee-types = "=0.25.1"

# tonic
tonic = { version = "0.12.3", features = ["gzip"] }

# metrics
metrics = "0.24.0"
metrics-exporter-prometheus = { version = "0.16.0", default-features = false }
metrics-process = "2.4.0"
metrics-util = "0.19.0"

# misc dependencies
auto_impl = "1"
async-trait = "0.1"
bytes = "1.5"
clap = { version = "4.4", features = ["derive"] }
cfg-if = { version = "1.0", default-features = false }
derive_more = "0.99"
eyre = "0.6"
futures = "0.3"
lazy_static = "1.4.0"
phf = { version = "0.11", features = ["macros"] }
once_cell = { version = "1.19", default-features = false, features = ["alloc"] }
parity-bytes = { version = "0.1.2", default-features = false }
parking_lot = "0.12"
secp256k1 = { version = "0.30", features = ["global-context", "std", "recovery"] }
serde = { version = "1.0", features = ["derive", "std"], default-features = true }
serde_json = "1.0"
serde_with = "3.3.0"
thiserror = "2.0"
tracing = "0.1"
futures-util = "0.3"
itertools = { version = "0.10.5" }
modular-bitfield = { version = "0.11.2" }
sha2 = { version = "0.9.9" }
uuid = { version = "1.8.0", features = ["v4"] }
arbitrary = "1.4"
assert_matches = "1.5"
proptest = "1.6"
proptest-derive = "0.5"
proptest-arbitrary-interop = "0.1.0"
tempfile = "3.16"
test-fuzz = "7"
mockall = "0.13.1"
rand = "0.8.5"
askama = "0.12.1"
shellexpand = "3.0.0"
toml = "0.8"
url = "2.5.4"
schnellru = "0.2"
confy = "0.6"

# tokio
tokio = { version = "1.44", features = ["full"] }
tokio-stream = "0.1"
tokio-util = { version = "0.7.4", features = ["codec"] }

# frost
frost-secp256k1-tr = { git = "https://github.com/botanix-labs/frost", rev = "b4c5ab017bb0d182f3c56fd80b95d6375a4bfeea", features = [
    "serde",
    "serialization",
]}

# bitcoin libs
miniscript = "12.3.2"
bitcoin = { version = "0.32.5", features = ["base64", "rand", "serde"] }
bitcoincore-rpc = "0.19.0"
bitcoin_hashes = "0.16.0"
bitcoincore-zmq = { version = "1.5.2", features = ["async"] }

# precompiles deps
bls_on_arkworks = "0.3.0"

# cometbft
cometbft = { git = "https://github.com/bnb-chain/greenfield-cometbft-rs.git", rev = "1282547" }
cometbft-light-client-verifier = { git = "https://github.com/bnb-chain/greenfield-cometbft-rs.git", rev = "1282547" }
cometbft-proto = { git = "https://github.com/bnb-chain/greenfield-cometbft-rs.git", rev = "1282547" }
cometbft-light-client = { git = "https://github.com/bnb-chain/greenfield-cometbft-rs.git", rev = "1282547" }

# other
prost = "0.12.6"

[profile.profiling]
inherits = "release"
debug = "full"
strip = "none"

[profile.release]
opt-level = 3
lto = "thin"
debug = "none"
strip = "symbols"
panic = "unwind"
codegen-units = 16

[profile.maxperf]
inherits = "release"
lto = "fat"
codegen-units = 1

# Speed up tests.
[profile.dev.package.proptest]
opt-level = 3

[profile.dev.package.rand_chacha]
opt-level = 3

[profile.dev.package.rand_xorshift]
opt-level = 3

[profile.dev.package.unarray]
opt-level = 3

# Meant for testing - all optimizations, but with debug assertions and overflow checks.
[profile.hivetests]
inherits = "test"
opt-level = 3
lto = "thin"

# Make sure debug symbols are in the bench profile
[profile.bench]
inherits = "release"
