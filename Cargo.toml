[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
homepage = "https://github.com/botanix-labs/reth"
repository = "https://github.com/botanix-labs/reth"
exclude = [".github/"]

[workspace]
resolver = "2"
members = [
    "bin/botanix-reth",
    "bin/btc-server",
    "bin/btc-server/client",
    "bin/botanix-cli",
    "bin/botanix-db-cleaner",
    "crates/botanix-storage",
    "crates/botanix-activation-manager",
    "crates/botanix-storage-migrate",
    "crates/botanix-utils",
    "crates/botanix-rpc-types",
    "crates/botanix-authority-rsp",
    "crates/botanix-authority-peg",
    "crates/botanix-fs-util",
    "crates/botanix-btc-wallet",
    "crates/botanix-authority-metrics",
    "crates/botanix-bitcoin-checkpoint",
    "crates/botanix-authority-edh",
    "crates/botanix-configs",
    "crates/botanix-hardforks",
    "crates/botanix-data-parser",
    "crates/botanix-comet-bft-rpc",
    "crates/botanix-rpc-config",
    "crates/botanix-chainspec",
    "crates/botanix-cli-parsers",
    "crates/botanix-cli-args",
    "crates/botanix-rpc-client",
    "crates/botanix-authority-consensus",
    "crates/botanix-consensus-common", "crates/botanix-evm",
]
default-members = ["bin/botanix-reth"]

[workspace.lints.rust]
missing_debug_implementations = "warn"
missing_docs = "warn"
rust_2018_idioms = { level = "deny", priority = -1 }
unreachable_pub = "warn"
unused_must_use = "deny"

[workspace.lints.rustdoc]
all = "warn"
# rust.unnameable-types = "warn"

[workspace.lints.clippy]
# These are some of clippy's nursery (i.e., experimental) lints that we like.
# By default, nursery lints are allowed. Some of the lints below have made good
# suggestions which we fixed. The others didn't have any findings, so we can
# assume they don't have that many false positives. Let's enable them to
# prevent future problems.
branches_sharing_code = "warn"
clear_with_drain = "warn"
derive_partial_eq_without_eq = "warn"
doc_markdown = "warn"
empty_line_after_doc_comments = "warn"
empty_line_after_outer_attr = "warn"
enum_glob_use = "warn"
equatable_if_let = "warn"
explicit_into_iter_loop = "warn"
explicit_iter_loop = "warn"
flat_map_option = "warn"
imprecise_flops = "warn"
iter_on_empty_collections = "warn"
iter_on_single_items = "warn"
iter_with_drain = "warn"
iter_without_into_iter = "warn"
large_stack_frames = "warn"
manual_assert = "warn"
manual_clamp = "warn"
manual_string_new = "warn"
match_same_arms = "warn"
missing_const_for_fn = "warn"
mutex_integer = "warn"
naive_bytecount = "warn"
needless_bitwise_bool = "warn"
needless_continue = "warn"
needless_pass_by_ref_mut = "warn"
nonstandard_macro_braces = "warn"
or_fun_call = "warn"
path_buf_push_overwrite = "warn"
read_zero_byte_vec = "warn"
redundant_clone = "warn"
single_char_pattern = "warn"
string_lit_as_bytes = "warn"
suboptimal_flops = "warn"
suspicious_operation_groupings = "warn"
trailing_empty_array = "warn"
trait_duplication_in_bounds = "warn"
transmute_undefined_repr = "warn"
trivial_regex = "warn"
tuple_array_conversions = "warn"
type_repetition_in_bounds = "warn"
uninhabited_references = "warn"
unnecessary_struct_initialization = "warn"
unused_peekable = "warn"
unused_rounding = "warn"
use_self = "warn"
useless_let_if_seq = "warn"
zero_sized_map_values = "warn"

# These are nursery lints which have findings. Allow them for now. Some are not
# quite mature enough for use in our codebase and some we don't really want.
# Explicitly listing should make it easier to fix in the future.
as_ptr_cast_mut = "allow"
cognitive_complexity = "allow"
collection_is_never_read = "allow"
debug_assert_with_mut_call = "allow"
fallible_impl_from = "allow"
future_not_send = "allow"
needless_collect = "allow"
non_send_fields_in_send_ty = "allow"
redundant_pub_crate = "allow"
significant_drop_in_scrutinee = "allow"
significant_drop_tightening = "allow"

[workspace.dependencies]

# Botanix deps
reth-botanix = { path = "bin/botanix-reth" }
btc-server = { path = "bin/btc-server" }
botanix-btc-server-client = { path = "bin/btc-server/client" }
botanix-cli = { path = "bin/botanix-cli" }
botanix-db-cleaner = { path = "bin/botanix-db-cleaner" }
botanix-storage = { path = "crates/botanix-storage" }
botanix-activation-manager = { path = "crates/botanix-activation-manager" }
botanix-storage-migrate = { path = "crates/botanix-storage-migrate" }
botanix-utils = { path = "crates/botanix-utils" }
botanix-rpc-types = { path = "crates/botanix-rpc-types" }
botanix-authority-rsp = { path = "crates/botanix-authority-rsp" }
botanix-authority-peg = { path = "crates/botanix-authority-peg" }
botanix-fs-util = { path = "crates/botanix-fs-util" }
botanix-btc-wallet = { path = "crates/botanix-btc-wallet" }
botanix-authority-metrics = { path = "crates/botanix-authority-metrics" }
botanix-bitcoin-checkpoint = { path = "crates/botanix-bitcoin-checkpoint" }
botanix-authority-edh ={ path = "crates/botanix-authority-edh" }
botanix-configs = { path = "crates/botanix-configs" }
botanix-hardforks = { path = "crates/botanix-hardforks" }
botanix-data-parser = { path = "crates/botanix-data-parser" }
botanix-comet-bft-rpc = { path = "crates/botanix-comet-bft-rpc" }
botanix-rpc-config = { path = "crates/botanix-rpc-config" }
botanix-chainspec = { path = "crates/botanix-chainspec" }
botanix-cli-parsers = { path = "crates/botanix-cli-parsers" }
botanix-cli-args = { path = "crates/botanix-cli-args" }
botanix-rpc-client = { path = "crates/botanix-rpc-client" }
botanix-authority-consensus = { path = "crates/botanix-authority-consensus" }
botanix-consensus-common = { path = "crates/botanix-consensus-common" }
botanix-evm = { path = "crates/botanix-evm" }

# reth dependencies - using botanix fork
reth = { git = "https://github.com/botanix-labs/reth", branch="botanix" }
reth-cli = { git = "https://github.com/botanix-labs/reth", branch="botanix" }
reth-cli-runner = { git = "https://github.com/botanix-labs/reth", branch="botanix" }
reth-cli-commands = { git = "https://github.com/botanix-labs/reth",  branch="botanix" }
reth-consensus-common = { git = "https://github.com/botanix-labs/reth",  branch="botanix" }
reth-chain-state = { git = "https://github.com/botanix-labs/reth",  branch="botanix" }
reth-config = { git = "https://github.com/botanix-labs/reth",  branch="botanix" }
reth-codecs = { git = "https://github.com/botanix-labs/reth",  branch="botanix" }
reth-codecs-derive = { git = "https://github.com/botanix-labs/reth",  branch="botanix" }
