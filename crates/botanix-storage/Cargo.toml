[package]
name = "botanix-storage"
version = { workspace = true }
edition = { workspace = true }
rust-version = { workspace = true }
license = { workspace = true }
homepage = { workspace = true }
repository = { workspace = true }
description = "Botanix storage implementation"

[features]
test-utils = [
    "reth-db/test-utils",
    "reth-chainspec",
    "reth-ethereum-engine-primitives",
    "reth-trie-db",
]

[dependencies]
alloy-primitives = { workspace = true }

# others
arbitrary = { workspace = true }
auto_impl = { workspace = true }
bytes = { workspace = true }
ciborium = { workspace = true }
eyre = { workspace = true }
frost-secp256k1-tr = { workspace = true }
itertools = { workspace = true }
modular-bitfield = { workspace = true }
parking_lot = { workspace = true }
reth-codecs = { workspace = true }
thiserror = { workspace = true }
# reth
reth-chainspec = { workspace = true, optional = true }
reth-db = { workspace = true, features = ["mdbx"] }
reth-db-api = { workspace = true }
reth-ethereum-engine-primitives = { workspace = true, optional = true }
reth-execution-types = { workspace = true }
reth-node-types = { workspace = true }
reth-primitives = { workspace = true, features = ["reth-codec"] }
reth-primitives-traits = { workspace = true }
reth-provider = { workspace = true }
reth-prune = { workspace = true }
reth-prune-types = { workspace = true }
reth-storage-api = { workspace = true }
reth-storage-errors = { workspace = true }
reth-trie-common = { workspace = true }
reth-trie-db = { workspace = true, optional = true }
secp256k1 = { workspace = true, features = ["global-context", "rand", "recovery"] }
serde = { workspace = true, default-features = false }
sha2 = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }

# Botanix
botanix-primitives = { workspace = true }
botanix-types = { workspace = true, features = ["compact", "arbitrary"] }

[dev-dependencies]
arbitrary = { workspace = true }
proptest = { workspace = true }
proptest-arbitrary-interop = { workspace = true }
reth-primitives = { workspace = true, features = ["arbitrary"] }
tempfile = { workspace = true }
test-fuzz = { workspace = true }
# Enable test-utils feature for tests
botanix-storage = { path = ".", features = ["test-utils"] }

[lints]
workspace = true
